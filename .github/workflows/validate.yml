# Jason Stys: real PyAV/Python/SQL/TypeScript cross-platform validation without artifact/cache uploads.
name: Validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Core / ${{ matrix.os }} / ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.12" }
          - { os: ubuntu-24.04, python: "3.14" }
          - { os: windows-latest, python: "3.14" }
          - { os: macos-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: { python-version: "${{ matrix.python }}" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: "24", package-manager-cache: false }
      - run: "python -m pip install --only-binary=:all: --require-hashes -r requirements-dev.lock"
      - run: npm ci --ignore-scripts --no-audit
      - run: npm run format:check && npm test && npm run build
      - run: python -m ruff check workbench tests tools
      - run: python -m ruff format --check workbench tests tools
      - run: python tools/docs_index.py --check
      - name: Full Python coverage with actual native widgets
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            command -v xvfb-run
            xvfb-run -a python -m pytest --cov=workbench --cov-report=term-missing
          else
            python -m pytest --cov=workbench --cov-report=term-missing
          fi
      - run: python tools/check_repo.py
      - run: python -m tools.benchmark
      - if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.14'
        run: python -m pip_audit --disable-pip --no-deps -r requirements-dev.lock -r requirements-package.lock
      - if: matrix.os == 'ubuntu-24.04' && matrix.python == '3.14'
        name: Live OSV / complete locked npm inventory / zero findings
        run: python tools/audit_osv.py
  browser:
    name: Real native-backed UI / Chromium + Firefox + WebKit + mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with: { python-version: "3.14" }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: { node-version: "24", package-manager-cache: false }
      - run: "python -m pip install --only-binary=:all: --require-hashes -r requirements-dev.lock"
      - run: npm ci --ignore-scripts --no-audit && npm run build
      - name: Bound official Ubuntu mirror access on the disposable runner
        if: runner.os == 'Linux'
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = "true"
          test "$RUNNER_OS" = "Linux"
          test "$(uname -m)" = "x86_64"
          . /etc/os-release
          test "$ID" = "ubuntu"
          test "$VERSION_ID" = "24.04"
          test -f /etc/apt/apt-mirrors.txt
          test -f /usr/share/keyrings/ubuntu-archive-keyring.gpg
          grep -Eq '^URIs:[[:space:]]+mirror[+]file:/etc/apt/apt-mirrors[.]txt[[:space:]]*$' /etc/apt/sources.list.d/ubuntu.sources
          grep -Eq '^Signed-By:[[:space:]]+/usr/share/keyrings/ubuntu-archive-keyring[.]gpg[[:space:]]*$' /etc/apt/sources.list.d/ubuntu.sources
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' |
            sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          printf '%s\n' 'Acquire::Retries "1";' 'Acquire::http::Timeout "15";' 'Acquire::https::Timeout "15";' |
            sudo tee /etc/apt/apt.conf.d/zzzz-portfolio-network >/dev/null
          apt_network_config="$(apt-config dump Acquire::Retries Acquire::http::Timeout Acquire::https::Timeout)"
          printf '%s\n' "$apt_network_config"
          grep -Fx 'Acquire::Retries "1";' <<< "$apt_network_config"
          grep -Fx 'Acquire::http::Timeout "15";' <<< "$apt_network_config"
          grep -Fx 'Acquire::https::Timeout "15";' <<< "$apt_network_config"
      - name: Install operating-system browser dependencies
        timeout-minutes: 10
        run: npx playwright install-deps chromium firefox webkit
      - name: Install exact locked browsers
        timeout-minutes: 5
        run: npx playwright install chromium firefox webkit
      - run: npm run test:e2e
